name: mantener-activa

# Streamlit Cloud duerme las apps tras ~12 h sin visitas. Este workflow la
# visita cada 6 horas con un navegador real (y la despierta si ya se durmió).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python .github/scripts/mantener_activa.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallo
          path: fallo.png
          if-no-files-found: ignore
